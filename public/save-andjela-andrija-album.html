    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: 18px;
        background: #f8f5ef;
        color: #29231f;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }

      .loader {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: min(100%, 390px);
        padding: 56px 22px;
        border: 1px solid #e3d9cc;
        background: #f0ebe2;
        box-shadow: 0 14px 42px #39291e13;
      }

      .loader::before {
        position: absolute;
        inset: 7px;
        border: 1px solid #d4c6b7;
        content: "";
        pointer-events: none;
      }

      .loader__monogram {
        color: #a21d34;
        font-size: clamp(40px, 12vw, 52px);
        font-style: italic;
        line-height: 1.2;
      }

      .loader__names,
      .loader__date,
      .loader__text,
      .loader__note {
        margin: 0;
      }

      .loader__names {
        font-size: 22px;
        font-weight: 400;
      }

      .loader__date {
        color: #645952;
        font-size: 15px;
        letter-spacing: 0.1em;
      }

      .loader__text,
      .loader__link,
      .loader__note {
        font-family: Arial, sans-serif;
        font-size: 11px;
        line-height: 1.6;
      }

      .loader__text {
        color: #645952;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .loader__line {
        position: relative;
        overflow: hidden;
        width: 90px;
        height: 1px;
        background: #d4c6b7;
      }

      .loader__line::after {
        position: absolute;
        inset: 0 auto 0 0;
        width: 45%;
        background: #a21d34;
        content: "";
        animation: loading-line 1.4s ease-in-out infinite;
      }

      .loader__link {
        color: #a21d34;
        text-underline-offset: 4px;
      }

      .loader__link:focus-visible {
        outline: 2px solid #a21d34;
        outline-offset: 6px;
      }

      @keyframes loading-line {
        from { transform: translateX(-120%); }
        to { transform: translateX(340%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader__line::after {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="loader" aria-labelledby="loader-title">
      <div class="loader__monogram" aria-hidden="true">A&amp;A</div>
      <h1 class="loader__names" id="loader-title">Andjela &amp; Andrija</h1>
      <p class="loader__date"><time datetime="2027-09-12">12.09.2027.</time></p>
      <p class="loader__text" role="status">Otvaramo album…</p>
      <div class="loader__line" aria-hidden="true"></div>

      <a class="loader__link" href="/save-andjela-andrija-album">Otvori album</a>
      <noscript>
        <p class="loader__note">Za otvaranje albuma dodirnite link iznad.</p>
      </noscript>
    </main>

    <script>
      (() => {
        const destination = "/save-andjela-andrija-album";
        const imageAssets = Array.from(
          document.querySelectorAll('link[rel="preload"][as="image"]'),
          (link) => link.href
        );

        let redirected = false;
        let fallbackTimer;

        function openInvitation() {
          if (redirected) return;
          redirected = true;
          window.clearTimeout(fallbackTimer);
          window.location.replace(destination);
        }

        function preloadImage(src) {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = resolve;
            img.onerror = resolve;
            img.src = src;
            if (img.complete) resolve();
          });
        }

        // Slike se učitavaju paralelno; najduže čekanje je dve sekunde.
        fallbackTimer = window.setTimeout(openInvitation, 2000);
        Promise.all(imageAssets.map(preloadImage)).then(openInvitation);
      })();
    </script>
  </body>
