    <noscript>
      <p>
        <a href="/save-andjela-andrija">
          Otvorite najavu venčanja
        </a>
      </p>
    </noscript>


    <script>
      (() => {
        const destination =
          "/save-andjela-andrija";

        const assets = [
          "/images/save-the-date/calla-lace/calla-background.png",
          "/images/save-the-date/calla-lace/ivory-envelope.png",
          "/images/save-the-date/calla-lace/ivory-envelope-open.png",
          "/images/save-the-date/calla-lace/sheer-white-lace.png",
        ];

        let redirected = false;


        function openInvitation() {
          if (redirected) return;

          redirected = true;

          window.location.replace(
            destination
          );
        }


        function preloadImage(src) {
          return new Promise((resolve) => {
            const image = new Image();

            let finished = false;


            function finish() {
              if (finished) return;

              finished = true;

              resolve();
            }


            image.onload = async () => {
              try {
                if (image.decode) {
                  await image.decode();
                }
              } catch {
                // Slika je već učitana.
              }

              finish();
            };


            /*
              Ako neki asset slučajno ne postoji,
              ne blokiramo celu pozivnicu.
            */
            image.onerror = finish;


            image.src = src;


            /*
              Ako je browser već ima u cache-u.
            */
            if (image.complete) {
              if (image.decode) {
                image
                  .decode()
                  .catch(() => {})
                  .finally(finish);
              } else {
                finish();
              }
            }
          });
        }


        Promise.all(
          assets.map(preloadImage)
        ).then(openInvitation);


        /*
          Rezerva za veoma slabu vezu:
          korisnik ipak ulazi u pozivnicu
          ako preload predugo traje.
        */
        window.setTimeout(
          openInvitation,
          6000
        );
      })();
    </script>
