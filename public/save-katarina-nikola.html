    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f8f6f1;
        color: #756b63;
        font: 18px Georgia, serif;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <p>Учитавање позивнице…</p>
    <noscript>
      <p><a href="/save-katarina-nikola">Отворите најаву венчања</a></p>
    </noscript>

    <script>
      (() => {
        const destination = "/save-katarina-nikola";
        const petals = new Image();
        let redirected = false;

        function openInvitation() {
          if (redirected) return;
          redirected = true;
          window.location.replace(destination);
        }

        petals.onload = openInvitation;
        petals.onerror = openInvitation;
        petals.fetchPriority = "high";
        petals.src = "/images/save-the-date/white-rose-petals.webp";

        // Rezerva ako zahtev za sliku ne završi na slaboj vezi.
        window.setTimeout(openInvitation, 5000);
      })();
    </script>
  </body>
