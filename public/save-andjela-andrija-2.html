    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;

        display: grid;
        place-items: center;

        background:
          linear-gradient(
            rgba(11, 10, 9, 0.68),
            rgba(11, 10, 9, 0.78)
          ),
          url("/images/save-the-date/ana-nikola-video-poster.jpg")
          center center / cover no-repeat;

        background-color: #0b0a09;

        color: #ffffff;

        font-family:
          Georgia,
          "Times New Roman",
          serif;

        text-align: center;
      }

      .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;

        padding: 24px;
      }

      .loader__monogram {
        font-size: 46px;
        line-height: 1;

        letter-spacing: 0.02em;

        opacity: 0.96;
      }

      .loader__text {
        margin: 0;

        font-size: 10px;
        line-height: 1.3;

        letter-spacing: 0.26em;

        text-transform: uppercase;

        opacity: 0.8;
      }

      .loader__line {
        position: relative;

        overflow: hidden;

        width: 90px;
        height: 1px;

        background:
          rgba(255, 255, 255, 0.22);
      }

      .loader__line::after {
        content: "";

        position: absolute;

        top: 0;
        left: -50%;

        width: 45%;
        height: 100%;

        background: #ffffff;

        animation:
          loadingLine
          1.4s
          ease-in-out
          infinite;
      }

      @keyframes loadingLine {
        from {
          left: -50%;
        }

        to {
          left: 110%;
        }
      }

      a {
        color: inherit;
      }
    </style>
  </head>


  <body>

    <div class="loader">

      <div class="loader__monogram">
        A&amp;A
      </div>

      <p class="loader__text">
        Učitavanje najave
      </p>

      <div
        class="loader__line"
        aria-hidden="true"
      ></div>

    </div>


    <noscript>
      <p>
        <a href="/save-andjela-andrija-2">
          Otvorite najavu venčanja
        </a>
      </p>
    </noscript>


    <script>
      (() => {
        const destination =
          "/save-andjela-andrija-2";


        const imageAssets = [
          "/images/save-the-date/envelope/ana-nikola-video-top.png",

          "/images/save-the-date/envelope/ana-nikola-video-bottom.png",

          "/images/save-the-date/ana-nikola-video-poster.jpg",

          "/images/save-the-date/sara-luka.png",
        ];


        const videoSrc =
          "/videos/save-the-date/ana-nikola.mp4";


        let redirected = false;


        function openInvitation() {
          if (redirected) return;

          redirected = true;

          window.location.replace(
            destination
          );
        }


        /* ===============================================
           IMAGE PRELOAD
        =============================================== */

        function preloadImage(src) {
          return new Promise((resolve) => {
            const img = new Image();

            let finished = false;


            function finish() {
              if (finished) return;

              finished = true;

              resolve();
            }


            img.onload = async () => {
              try {
                if (img.decode) {
                  await img.decode();
                }
              } catch {
                // Slika je već učitana.
              }

              finish();
            };


            img.onerror = finish;


            img.src = src;


            if (img.complete) {
              if (img.decode) {
                img
                  .decode()
                  .catch(() => {})
                  .finally(finish);
              } else {
                finish();
              }
            }
          });
        }


        /* ===============================================
           VIDEO PRELOAD
        =============================================== */

        function preloadVideo(src) {
          return new Promise((resolve) => {
            const video =
              document.createElement("video");

            let finished = false;


            function finish() {
              if (finished) return;

              finished = true;

              video.removeEventListener(
                "loadeddata",
                finish
              );

              video.removeEventListener(
                "canplay",
                finish
              );

              video.removeEventListener(
                "error",
                finish
              );

              resolve();
            }


            video.preload = "auto";

            video.muted = true;

            video.playsInline = true;


            video.addEventListener(
              "loadeddata",
              finish,
              { once: true }
            );


            video.addEventListener(
              "canplay",
              finish,
              { once: true }
            );


            video.addEventListener(
              "error",
              finish,
              { once: true }
            );


            video.src = src;

            video.load();
          });
        }


        /* ===============================================
           LOAD EVERYTHING
        =============================================== */

        Promise.all([
          ...imageAssets.map(
            preloadImage
          ),

          preloadVideo(
            videoSrc
          ),
        ]).then(
          openInvitation
        );


        /*
          Rezerva ako je veza baš slaba.

          Posle 8 sekundi ipak otvaramo
          Save the Date.
        */
        window.setTimeout(
          openInvitation,
          8000
        );
      })();
    </script>
